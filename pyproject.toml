[project]
name = "langgraph-prac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.16",
    "langgraph-cli[inemem,inmem]>=0.4.37",
    "pinecone>=7.3,<8",
    "pip>=26.2.2",
    "pymupdf>=2.0",
    "streamlit>=1.66.0",
]

[project.scripts]
langgraph-prac = "langgraph_prac:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
